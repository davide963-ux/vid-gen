<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
    <style>
      /* THEME: change these six values to restyle the whole video */
      :root { --bg: #0B1220; --ink: #F1F3F8; --accent: #E9B949; --panel: #131D33; --line: #2A3A5C; --muted: #8C97AD; --good: #67E3AE; --bad: #F0616D; --on-accent: #0B1220; --dots: rgba(233,185,73,0.10); --glow: rgba(233,185,73,0.12); }
      :root { --bg: #ebebeb; --ink: #0e3f3d; --accent: #17736e; --panel: #ffffff; --line: #cfd6d6; --muted: #5c7270; --good: #36c3b0; --bad: #d9574f; --on-accent: #ffffff; --dots: rgba(14,63,61,0.06); --glow: rgba(54,195,176,0.20); }

      @font-face { font-family: 'Space Grotesk'; font-weight: 500; src: url('assets/fonts/space-grotesk-latin-500-normal.woff2') format('woff2'); }
      @font-face { font-family: 'Space Grotesk'; font-weight: 600; src: url('assets/fonts/space-grotesk-latin-600-normal.woff2') format('woff2'); }
      @font-face { font-family: 'Space Grotesk'; font-weight: 700; src: url('assets/fonts/space-grotesk-latin-700-normal.woff2') format('woff2'); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background-color: var(--bg); background-image: radial-gradient(var(--dots) 2.5px, transparent 2.5px); background-size: 60px 60px; font-family: 'Space Grotesk', sans-serif; color: var(--ink); }
      #stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; }
      #glow { position: absolute; left: -200px; top: -300px; width: 1480px; height: 1100px; pointer-events: none; background: radial-gradient(closest-side, var(--glow), transparent); }
      /* SAFE AREA (1080x1920): keep content at x 60..960 and y 120..1600. Right ~120px and bottom ~320px belong to TikTok's UI. */
      .abs { position: absolute; opacity: 0; }
      .lot { position: absolute; opacity: 0; }
      .big { font-weight: 700; letter-spacing: -0.035em; line-height: 1.02; text-align: center; white-space: nowrap; }
      .ac { color: var(--accent); } .gn { color: var(--good); } .rd { color: var(--bad); }
      .tag { font-weight: 600; font-size: 30px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); text-align: center; white-space: nowrap; }
      .chip { display: inline-block; padding: 12px 30px; border-radius: 100px; background: rgba(233,185,73,0.10); border: 1.5px solid rgba(233,185,73,0.45); color: var(--accent); font-weight: 600; font-size: 28px; letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; }
      .card { background: var(--panel); border: 1.5px solid var(--line); border-radius: 28px; box-shadow: 0 24px 60px rgba(0,0,0,0.45); }
      .strike { position: absolute; height: 10px; border-radius: 6px; background: var(--bad); transform-origin: left center; transform: scaleX(0); }
      .mw { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: 0.14em; margin-bottom: -0.14em; }
      .mi { display: inline-block; will-change: transform; }
      #prog { position: absolute; left: 0; bottom: 0; width: 1080px; height: 6px; background: var(--accent); transform-origin: left center; }
      #caps { position: absolute; left: 0; top: 1392px; width: 1080px; height: 190px; }
      .cg { position: absolute; left: 90px; top: 0; width: 900px; text-align: center; opacity: 0; }
      .cg .pill { display: inline-block; padding: 14px 30px 16px; border-radius: 34px; background: var(--panel); border: 1.5px solid var(--line); box-shadow: 0 8px 30px rgba(0,0,0,0.5); font-weight: 600; font-size: 50px; line-height: 1.2; letter-spacing: -0.01em; color: var(--ink); }
      .cw { display: inline-block; margin: 0 4px; padding: 0 10px; border-radius: 12px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12.66" data-width="1080" data-height="1920">
      <div id="stage" class="clip" data-start="0" data-duration="12.66" data-track-index="0">
        <div id="glow"></div>
        <div id="dyn"></div>
        <!-- illustrations drawn with the teal-spot kit (gen/cards.mjs), 840 wide so they sit inside the safe area -->
        <img id="ca" class="abs" src="assets/img/card-a.svg" style="left:80px;top:470px;width:880px" />
        <img id="cb" class="abs" src="assets/img/card-b.svg" style="left:80px;top:470px;width:880px" />
        <img id="cc" class="abs" src="assets/img/card-c.svg" style="left:80px;top:470px;width:880px" />
        <div id="hk1" class="abs big" style="left:0;top:230px;width:1080px;font-size:116px">WHAT IS</div>
        <div id="hk2" class="abs big ac" style="left:0;top:350px;width:1080px;font-size:88px">COMPOUND INTEREST?</div>
        <div id="ch1" class="abs" style="left:0;top:1190px;width:1080px;text-align:center"><span class="chip">1 · Your deposit</span></div>
        <div id="ch2" class="abs" style="left:0;top:1190px;width:1080px;text-align:center"><span class="chip">2 · Interest on the deposit</span></div>
        <div id="ch3" class="abs" style="left:0;top:1190px;width:1080px;text-align:center"><span class="chip">3 · Interest on the interest</span></div>
        <div id="sn" class="abs big ac" style="left:0;top:260px;width:1080px;font-size:132px">SNOWBALLS</div>
        <div id="e1" class="abs big" style="left:0;top:520px;width:1080px;font-size:116px">YOU DIDN'T KNOW</div>
        <div id="e2" class="abs big ac" style="left:0;top:660px;width:1080px;font-size:104px">THAT ABOUT MONEY.</div>
        <div id="conf" class="lot" style="left:0;top:80px;width:1080px;height:1080px"></div>

        <div id="caps"></div>
        <div id="prog"></div>
      </div>
    </div>

    <script>
      const WORDS = [{"w":"What","s":0.3,"e":0.44,"line":1},{"w":"is","s":0.44,"e":0.58,"line":1},{"w":"compound","s":0.58,"e":1.04,"line":1},{"w":"interest?","s":1.04,"e":1.56,"line":1},{"w":"First,","s":2.285,"e":2.665,"line":2},{"w":"you","s":2.925,"e":3.025,"line":2},{"w":"earn","s":2.965,"e":3.145,"line":2},{"w":"interest","s":3.145,"e":3.585,"line":2},{"w":"on","s":3.585,"e":3.825,"line":2},{"w":"your","s":3.825,"e":3.925,"line":2},{"w":"deposit.","s":3.925,"e":4.305,"line":2},{"w":"Then,","s":4.889,"e":5.149,"line":3},{"w":"you","s":5.149,"e":5.409,"line":3},{"w":"earn","s":5.409,"e":5.589,"line":3},{"w":"interest","s":5.589,"e":6.029,"line":3},{"w":"on","s":6.029,"e":6.269,"line":3},{"w":"that","s":6.269,"e":6.449,"line":3},{"w":"interest.","s":6.449,"e":6.829,"line":3},{"w":"Over","s":7.536,"e":7.816,"line":4},{"w":"time,","s":7.816,"e":8.216,"line":4},{"w":"it","s":8.316,"e":8.436,"line":4},{"w":"snowballs.","s":8.436,"e":8.976,"line":4},{"w":"You","s":9.607,"e":9.767,"line":5},{"w":"didn't","s":9.767,"e":10.067,"line":5},{"w":"know","s":10.067,"e":10.207,"line":5},{"w":"that","s":10.207,"e":10.467,"line":5},{"w":"about","s":10.467,"e":10.747,"line":5},{"w":"money.","s":10.747,"e":11.047,"line":5}];
      window.__timelines = window.__timelines || {};
      const wd = (l, k) => WORDS.filter((w) => w.line === l)[k].s;     // start time of word k in script line l
      const tl = gsap.timeline({ paused: true });
      const E = 'power3.out', IO = 'power2.inOut';
      const $ = (s) => document.querySelector(s);
      const R = (el, t, from, to) => tl.fromTo(el, Object.assign({ opacity: 0, y: 30 }, from || {}), Object.assign({ opacity: 1, y: 0, duration: 0.5, ease: E, immediateRender: false }, to || {}), t);
      const X = (el, t, d) => tl.to(el, { opacity: 0, duration: d || 0.25, ease: 'none' }, t);
      const POP = { scale: 0.6, y: 24 }, POPTO = { scale: 1, duration: 0.5 };
      const STRIKE = (sel, t) => tl.fromTo(sel, { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: 'power2.out', immediateRender: false }, t);
      const add = (h) => $('#dyn').insertAdjacentHTML('beforeend', h);
      const money = (v) => '$' + Math.round(v).toLocaleString('en-US');
      const count = (sel, t, from, to, dur) => { const o = { v: from }; tl.to(o, { v: to, duration: dur, ease: 'power3.out', onUpdate() { $(sel).textContent = money(o.v); } }, t); };
      // Paste-in helpers for HyperFrames templates (classic <script>, GSAP timeline `tl`, `$` = querySelector).
// Ideas adapted (rewritten for our stack) from the MIT-licensed iart-ai/tiktok-video-skills + kinetic-typography-skills.
// Everything is seek-safe: tweens only, no timers, no randomness except the seeded hash().
//
// Needs this CSS in the template:
//   .mw { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: 0.14em; margin-bottom: -0.14em; }
//   .mi { display: inline-block; will-change: transform; }

const SAFE = { left: 60, right: 960, top: 120, bottom: 1600 };   // 1080x1920: keep text/cards inside; TikTok UI sits outside (right ~120px, bottom ~320px)

const hashH = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

// Split a PLAIN-TEXT element into masked words (screen-reader label kept). Returns the inner word nodes.
const splitWords = (sel) => {
  const el = document.querySelector(sel); const txt = el.textContent.trim();
  el.setAttribute('aria-label', txt);
  el.innerHTML = txt.split(/\s+/).map((w) => `<span class="mw"><span class="mi">${w}</span></span>`).join(' ');
  return el.querySelectorAll('.mi');
};

// 1) Mask reveal: each word rises out of a clipped line. ~0.6s per word, 60ms stagger, expo ease (keep the whole reveal under ~0.8-1.0s).
//    Use for headlines that appear mid-video (NOT the hook; see hookNow).
const maskReveal = (tl, sel, t, o = {}) => {
  const items = splitWords(sel);
  tl.set(sel, { opacity: 1 }, t);
  tl.fromTo(items, { yPercent: 115 }, { yPercent: 0, duration: o.dur || 0.6, ease: 'expo.out', stagger: o.stagger || 0.06, immediateRender: false }, t);
  return items.length;
};
// matching exit: words drop back down (use instead of a plain fade when a headline leaves)
const maskHide = (tl, sel, t, o = {}) => {
  const items = document.querySelectorAll(sel + ' .mi');
  tl.to(items, { yPercent: -115, duration: o.dur || 0.35, ease: 'power3.in', stagger: o.stagger || 0.03 }, t);
  tl.set(sel, { opacity: 0 }, t + (o.dur || 0.35) + 0.03 * items.length);
};

// 2) Hook on frame 1: the hook text is fully visible at t=0 (no fade-up, no fade from black); only a tiny settle motion.
const hookNow = (tl, sels) => { sels.forEach((s) => { tl.set(s, { opacity: 1 }, 0); tl.fromTo(s, { scale: 1.05 }, { scale: 1, duration: 0.6, ease: 'power3.out', immediateRender: false }, 0); }); };

// 3) Pattern interrupt: a quick punch-in pulse on an element (use on long holds).
const punch = (tl, sel, t, o = {}) => {
  tl.fromTo(sel, { scale: 1 }, { scale: o.scale || 1.07, duration: o.dur || 0.18, ease: 'power2.out', immediateRender: false }, t);
  tl.to(sel, { scale: 1, duration: 0.45, ease: 'power2.inOut' }, t + (o.dur || 0.18));
};
// Pulse an element every ~3s (uneven: 2.2s-3.8s gaps) between `from` and `to`. Never use a metronome gap.
const heartbeat = (tl, sel, from, to, o = {}) => { let t = from + 1.2; let i = 0; while (t < to - 0.8) { punch(tl, sel, t, o); t += 2.2 + hashH(i++ + (o.seed || 0)) * 1.6; } };

// 4) Optional seamless loop: end on the same first-frame look. Fade the final card out to the hook's background in the last 0.5s
//    and make the last spoken line read as the lead-in to the first line ("...and that is why" -> hook).


      // ================= SCENES (src/scenes.js) =================
      const NO_CAPTION_LINES = [5];
      // rule 1: hook text AND the first illustration are on screen at frame 1
      hookNow(tl, ['#hk1', '#hk2', '#ca']);
      ['#hk1', '#hk2'].forEach((s) => tl.to(s, { opacity: 0, y: -40, duration: 0.3, ease: 'power2.in' }, 2.0));
      // 1 deposit
      R('#ch1', wd(2, 0) - 0.05, {}, { duration: 0.4 });
      punch(tl, '#ca', wd(2, 6), { scale: 1.05 });
      X('#ch1', 4.7, 0.2);
      // 2 interest on the deposit (card B)
      tl.to('#ca', { opacity: 0, x: -30, duration: 0.4, ease: 'power2.in' }, 4.65);
      tl.fromTo('#cb', { opacity: 0, x: 30, y: 0 }, { opacity: 1, x: 0, duration: 0.5, ease: 'power3.out', immediateRender: false }, 4.75);
      R('#ch2', wd(3, 0), {}, { duration: 0.4 });
      punch(tl, '#cb', wd(3, 3), { scale: 1.05 });
      punch(tl, '#cb', wd(3, 6), { scale: 1.05 });
      X('#ch2', 7.4, 0.2);
      // 3 snowball (card C)
      tl.to('#cb', { opacity: 0, x: -30, duration: 0.4, ease: 'power2.in' }, 7.35);
      tl.fromTo('#cc', { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.5, ease: 'power3.out', immediateRender: false }, 7.45);
      R('#ch3', wd(4, 0) - 0.1, {}, { duration: 0.4 });
      maskReveal(tl, '#sn', wd(4, 3) - 0.15);
      heartbeat(tl, '#cc', 8.0, 9.4, { scale: 1.04 });
      ['#cc', '#ch3', '#sn'].forEach((s) => X(s, 9.45, 0.3));
      // ending
      maskReveal(tl, '#e1', 9.62); maskReveal(tl, '#e2', wd(5, 3) - 0.1);
      tl.fromTo('#conf', { opacity: 0 }, { opacity: 1, duration: 0.01, immediateRender: false }, 10.8); tl.to('#conf', { opacity: 0, duration: 0.01 }, 12.6);
      const lot = lottie.loadAnimation({ container: document.getElementById('conf'), renderer: 'svg', loop: false, autoplay: false, path: 'assets/lottie/confetti-s.json', rendererSettings: { preserveAspectRatio: 'xMidYMid meet' } }); (window.__hfLottie = window.__hfLottie || []).push(lot);


      // ================= captions (word-timed karaoke) =================
      const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
      const hexA = (h, a) => { const n = parseInt(h.replace('#', ''), 16); return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`; };
      const ACC = css('--accent'), INK = css('--ink'), ONACC = css('--on-accent');
      const capsEl = $('#caps');
      const groups = []; let cur = [];
      WORDS.forEach((w, i) => { cur.push(w); const nx = WORDS[i + 1]; const endS = /[.!?]$/.test(w.w); const endC = /,$/.test(w.w) && cur.length >= 2; if (!nx || endS || endC || cur.length >= 4 || (nx && nx.s - w.e > 0.5)) { groups.push(cur); cur = []; } });
      groups.forEach((g, gi) => {
        if (typeof NO_CAPTION_LINES !== 'undefined' && NO_CAPTION_LINES.includes(g[0].line)) return;
        const d = document.createElement('div'); d.className = 'cg'; const pill = document.createElement('div'); pill.className = 'pill'; d.appendChild(pill);
        g.forEach((w, wi) => { const s = document.createElement('span'); s.className = 'cw'; s.id = `cw${gi}_${wi}`; s.textContent = w.w; pill.appendChild(s); });
        capsEl.appendChild(d);
        const a0 = g[0].s - 0.03, nextS = groups[gi + 1] ? groups[gi + 1][0].s : 1e9, b = Math.min(g[g.length - 1].e + 0.2, nextS - 0.08);
        tl.fromTo(d, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.1, ease: 'power2.out', immediateRender: false }, Math.max(0, a0));
        tl.to(d, { opacity: 0, duration: 0.06, ease: 'none' }, b);
        g.forEach((w, wi) => { const sp = `#cw${gi}_${wi}`;
          tl.fromTo(sp, { backgroundColor: hexA(ACC, 0), color: INK }, { backgroundColor: ACC, color: ONACC, duration: 0.06, ease: 'none', immediateRender: false }, w.s);
          tl.to(sp, { backgroundColor: hexA(ACC, 0), color: INK, duration: 0.06, ease: 'none' }, Math.max(w.e, w.s + 0.1)); });
      });
      tl.fromTo('#prog', { scaleX: 0 }, { scaleX: 1, duration: 12.66, ease: 'none', immediateRender: false }, 0);
      window.__timelines['main'] = tl;
      tl.seek(0);
    </script>
  </body>
