            out.l[j] = herm(k1.l[ax], k2.l[ax], ml1, ml2, h, u);
          });
          out.f = lerp(k1.f, k2.f, sm(u));
          return out;
        }

        // ---------- projected DOM tags ----------
        const proj = new THREE.Vector3();
        const place = (id, v) => { proj.copy(v).project(camera); const el = document.getElementById(id); el.style.transform = `translate(${(proj.x * 0.5 + 0.5) * W}px, ${(-proj.y * 0.5 + 0.5) * H}px) translate(-50%, -140%)`; };

        // ---------- the whole world as a pure function of time ----------
        const v1 = new THREE.Vector3(), v2 = new THREE.Vector3(), v3 = new THREE.Vector3();
        const ACC = new THREE.Vector3(0, 1.6, 1.0);
        function renderAt(t) {
          const c = camAt(t);
          camera.position.set(c.p[0] + Math.sin(t * 0.5) * 0.06, c.p[1] + Math.sin(t * 0.37) * 0.05, c.p[2]);
          camera.fov = c.f; camera.updateProjectionMatrix(); camera.lookAt(c.l[0], c.l[1], c.l[2]); camera.updateMatrixWorld(); camera.matrixWorldInverse.copy(camera.matrixWorld).invert();

          scene.fog.density = lerp(0.026, 0.0028, win(t, 62.0, 68.0));
          // dust drift
          for (let i = 0; i < dustN; i++) { dustPos[i * 3] = dustBase[i * 3] + Math.sin(t * 0.2 + i) * 0.4; dustPos[i * 3 + 1] = (dustBase[i * 3 + 1] + t * 0.12 * (0.4 + hash(i + 5))) % 14; dustPos[i * 3 + 2] = dustBase[i * 3 + 2]; }
          dustGeo.attributes.position.needsUpdate = true;

          // bank (floating) + intro reveal
          const intro = win(t, 0.2, 2.4);
          bank.position.y = 0.4 + 0.1 * Math.sin(t * 0.6); bank.visible = true;
          rim.intensity = 8 + 10 * intro + 14 * win(t, 17.6, 18.4) * (1 - win(t, 20, 21)) + 18 * win(t, 40.3, 40.7) * (1 - win(t, 41, 42));
          halo.material.opacity = 0.1 + 0.22 * intro + 0.04 * Math.sin(t * 1.3);
          door.material.opacity = 0.18 + 0.32 * win(t, 5.0, 6.5) + 0.2 * win(t, 17.6, 18.3) * (1 - win(t, 21, 22));
          pool.material.opacity = 0.12 + 0.2 * intro;

          // person
          const pIn = win(t, 6.8, 7.9) * (1 - win(t, 33.6, 35.0));
          person.visible = t > 6.7; person.scale.setScalar(Math.max(0.001, 0.9 * pIn)); person.position.y = (1 - pIn) * -0.6;

          // contract + links
          const cIn = win(t, 5.2, 6.4) * (1 - win(t, 10.0, 10.8));
          contract.material.opacity = cIn; contract.visible = cIn > 0.01; contract.position.y = 2.5 + Math.sin(t * 0.9) * 0.08; contract.rotation.y = Math.sin(t * 0.4) * 0.12;
          const lk = win(t, 7.4, 8.8) * (1 - win(t, 10.0, 10.8));
          const lp = (a, b, u) => { v3.lerpVectors(a, b, u); return v3; };
          linkPos.set([DOOR.x, DOOR.y, DOOR.z, ...lp(DOOR, contract.position, lk).toArray(), contract.position.x, contract.position.y - 1.4, contract.position.z, ...lp(contract.position.clone().setY(contract.position.y - 1.4), PERSON_HEAD, lk).toArray()], 0);
          linkGeo.attributes.position.needsUpdate = true; links.visible = lk > 0.01;

          // someone else's account + cash that does not get handed over
          const oIn = win(t, 10.9, 11.7) * (1 - win(t, 16.8, 17.6));
          other.visible = oIn > 0.01; other.scale.setScalar(Math.max(0.001, oIn));
          const mv = win(t, 12.1, 14.4);
          cash.position.set(mv * 1.55, mv * 0.4 + Math.sin(mv * Math.PI) * 0.7, mv * 1.2);
          cash.scale.setScalar(1 - 0.9 * win(t, 15.4, 16.6));
          cross.material.opacity = win(t, 15.3, 15.8) * (1 - win(t, 16.6, 17.4)); cross.position.set(-0.55 + Math.sin(t * 1.2) * 0.03, 1.8, 0.7);

          // digit sprites: cash dissolving into numbers (15.6-17.4) and new money streaming bank -> account (18.1-23.0)
          digits.forEach((s, i) => {
            let a = 0;
            if (i < 36) { const u = clamp((t - (15.5 + hash(i) * 1.0)) / 1.6); a = Math.sin(Math.PI * u); v1.set(-0.8 + (hash(i + 4) - 0.5) * 0.9, 1.1 + u * 2.4, 0.6 + hash(i + 8) * 0.4); }
            else { const u = clamp((t - (18.1 + (i - 36) * 0.085)) / 2.6); a = Math.sin(Math.PI * u) ** 0.7; v1.copy(arc(DOOR, ACC, u, 1.4)); v1.x += Math.sin(i * 3.1 + u * 7) * 0.35; }
            s.position.copy(v1); s.material.opacity = a * 0.95; s.visible = a > 0.01;
          });

          // floating notes / coins / cards appear with the new money
          const fIn = win(t, 23.4, 25.4) * (1 - win(t, 32.2, 34.2));
          floaters.visible = fIn > 0.01;
          fl.forEach((f, i) => { f.m.position.set(f.base.x + Math.sin(t * 0.3 + f.ph) * 0.5, f.base.y + Math.sin(t * 0.5 + f.ph) * 0.4 + (1 - fIn) * -3, f.base.z); f.m.rotation.set(t * 0.2 + f.ph, t * 0.35 + f.ph, f.k === 1 ? t * 0.4 : 0); f.m.scale.setScalar(Math.max(0.001, 0.6 * fIn)); });

          // economy
          econ.children.forEach((g) => { const u = win(t, g.userData.at, g.userData.at + 0.9) * (1 - win(t, 63.0, 66.5) * 0.0); g.visible = u > 0.01; g.scale.set(1, Math.max(0.001, u), 1); });
          for (let n = 0; n < NODES.length; n++) {
            const w = win(t, 26.0 + n * 0.2, 27.6 + n * 0.2) * (1 - win(t, 59.5, 62.5) * 0.6);
            for (let j = 0; j < SEG; j++) {
              const o = (n * SEG + j) * 6, a = j / SEG, b = (j + 1) / SEG;
              const A = arc(PERSON_HEAD, NODES[n].top, Math.min(a, w), 1.6 + (n % 4) * 0.5), Bv = arc(PERSON_HEAD, NODES[n].top, Math.min(b, w), 1.6 + (n % 4) * 0.5);
              txPos[o] = A.x; txPos[o + 1] = A.y; txPos[o + 2] = A.z; txPos[o + 3] = Bv.x; txPos[o + 4] = Bv.y; txPos[o + 5] = Bv.z;
            }
          }
          txGeo.attributes.position.needsUpdate = true; tx.visible = t > 26 && t < 35.2; tx.material.opacity = 0.55 * (1 - win(t, 33.3, 34.8));

          // money particles
          const eOut = win(t, 25.8, 27.4) * (1 - win(t, 53.0, 54.4));          // bank -> economy
          const eBack = win(t, 54.8, 56.0) * (1 - win(t, 61.8, 62.8));         // economy -> bank, dissolving
          for (let i = 0; i < pN; i++) {
            const ph = hash(i), T0 = 2.6 + hash(i + 11) * 2.2, d = NODES[i % NODES.length].top;
            let u = ((t * (1 / T0) + ph) % 1), a = 0;
            if (t >= 25.8 && t < 54.6) { a = eOut; v1.copy(arc(DOOR, d, u, 1.2 + 2 * hash(i + 3))); }
            else if (t >= 54.8) { a = eBack; const uu = 1 - u; v1.copy(arc(DOOR, d, uu, 1.2 + 2 * hash(i + 3))); v1.x += (1 - uu) * (hash(i + 7) - 0.5) * 0.2; a *= (u < 0.12 ? u / 0.12 : 1); }
            else { a = 0; v1.set(0, -50, 0); }
            const e = a * Math.sin(Math.PI * u) ** 0.5;
            pPos[i * 3] = v1.x; pPos[i * 3 + 1] = v1.y; pPos[i * 3 + 2] = v1.z;
            const sc = e; pCol[i * 3] = 0.40 * sc; pCol[i * 3 + 1] = 0.89 * sc; pCol[i * 3 + 2] = 0.68 * sc;
          }
          pGeo.attributes.position.needsUpdate = true; pGeo.attributes.color.needsUpdate = true;

          // wall shield + orbiting shields
          const wIn = win(t, 40.2, 40.5) * (1 - win(t, 41.0, 42.4));
          wall.visible = wIn > 0.01; wall.children[0].material.opacity = 0.35 * wIn; wall.children[1].material.opacity = wIn; wall.scale.setScalar(2.2 + 0.5 * win(t, 40.2, 40.9));
          SHIELDS.forEach((s) => {
            const u = win(t, s.at, s.at + 0.7) * (1 - win(t, 51.9, 52.9)); const ang = s.k * (Math.PI * 2 / 5) + 0.4 * (t - 41.5);
            s.g.visible = u > 0.01; s.g.scale.setScalar(Math.max(0.001, 1.05 * u));
            s.g.position.set(Math.cos(ang) * 2.5, 3.0 + Math.sin(t * 0.8 + s.k) * 0.25, -6.0 + Math.sin(ang) * 3.2);
            s.g.lookAt(camera.position);
          });

          // network reveal
          for (let i = 0; i < NN; i++) { const u = win(t, nodeAt(i), nodeAt(i) + 0.5); dummy.position.copy(NP[i]); dummy.scale.setScalar(Math.max(0.0001, u * (i === 0 ? 1.6 : (0.6 + hash(i + 40) * 0.9)))); dummy.updateMatrix(); nodeMesh.setMatrixAt(i, dummy.matrix); }
          nodeMesh.instanceMatrix.needsUpdate = true; nodeMesh.visible = t > 62.8;
          net.geometry.setDrawRange(0, Math.floor(edgesIdx.length * 2 * win(t, 63.4, 67.6))); net.visible = t > 63.3;

          // labels
          place('lblBank', new THREE.Vector3(0, 4.2, -6.2)); place('lblYou', new THREE.Vector3(1.0, 1.7, 1.0)); place('lblOther', new THREE.Vector3(-1.7, 1.6, -0.2)); place('lblNew', new THREE.Vector3(0, 3.6, -6));

          // bloom pulses
          const pulse = (a, b) => win(t, a, a + 0.15) * (1 - win(t, a + 0.15, b));
          bloom.strength = 0.42 + 0.5 * pulse(23.4, 24.6) + 0.3 * pulse(18.1, 19.2) + 0.5 * pulse(40.3, 41.4) + 0.4 * pulse(67.4, 69.0) + 0.14 * win(t, 63, 70);
          composer.render();
        }

        window.addEventListener('hf-seek', (e) => renderAt(e.detail.time));
        renderAt(window.__hfThreeTime || 0);
      }
      window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady['money-3d'] = build();
    </script>
  </body>
