<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
@font-face { font-family: 'Space Grotesk'; font-weight: 700; src: url('assets/fonts/space-grotesk-latin-700-normal.woff2') format('woff2'); }
@font-face { font-family: 'Space Grotesk'; font-weight: 600; src: url('assets/fonts/space-grotesk-latin-600-normal.woff2') format('woff2'); }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0a0a0a; }
#root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: radial-gradient(closest-side at 50% 42%, #2b1f07, #0a0a0a 85%); font-family: 'Space Grotesk', sans-serif; color: #fffdf6; }
#stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
.t { position: absolute; left: 0; width: 1080px; text-align: center; font-weight: 700; letter-spacing: -0.035em; line-height: 1; white-space: nowrap; }
.card { position: absolute; left: 120px; top: 930px; width: 840px; height: 500px; border-radius: 50px; background: linear-gradient(135deg,#f6cf72,#d79a22 60%,#b57a12); box-shadow: 0 40px 90px rgba(0,0,0,.7), 0 0 120px rgba(229,171,51,.25), inset 0 2px 0 rgba(255,255,255,.35); transform: rotate(-6deg); }
.rays { position:absolute; left:-160px; top:880px; width:1400px; height:1400px; border-radius:50%; background: repeating-conic-gradient(from 0deg, rgba(229,171,51,.22) 0deg 9deg, rgba(229,171,51,0) 9deg 24deg); -webkit-mask-image: radial-gradient(closest-side,#000 25%,transparent 100%); }
#scene3d { filter: drop-shadow(0 40px 50px rgba(0,0,0,.7)) drop-shadow(0 0 70px rgba(229,171,51,.35)); position:absolute; left:0; top:920px; width:1080px; height:700px; perspective:1700px; }
#lat { position:absolute; left:540px; top:350px; width:0; height:0; transform-style:preserve-3d; transform: rotateX(-26deg) rotateY(-34deg) scale(0.84);  }
.cu { position:absolute; width:0; height:0; transform-style:preserve-3d; }
.fc { position:absolute; left:-62px; top:-62px; width:124px; height:124px; border-radius:6px; backface-visibility:hidden; }
.chipx { position: absolute; left: 64px; top: 130px; width: 120px; height: 90px; border-radius: 18px; background: linear-gradient(135deg,#fbe7a5,#c9921f); border: 2px solid rgba(0,0,0,.25); }
.num { position: absolute; left: 64px; bottom: 120px; font-weight: 700; font-size: 56px; color: #0a0a0a; letter-spacing: -.02em; }
.lab { position: absolute; left: 64px; bottom: 56px; font-weight: 600; font-size: 30px; letter-spacing: .14em; color: #3b2a05; }
.coin { position: absolute; left: 700px; top: 640px; width: 260px; height: 260px; }
.pill { position: absolute; left: 150px; top: 1600px; width: 780px; padding: 26px 0; border-radius: 100px; background: #e5ab33; color: #0a0a0a; font-weight: 700; font-size: 50px; letter-spacing: .02em; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,.5); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="1080" data-height="1920">
  <div id="stage" class="clip" data-start="0" data-duration="1" data-track-index="0">
    <div class="t" style="top:290px;font-size:98px">YOU DIDN’T KNOW</div>
    <div class="t" style="top:398px;font-size:92px;color:#e5ab33">THE WORD “SALARY”</div>
    <div class="t" style="top:504px;font-size:122px">COMES FROM</div>
    <div class="t" style="top:640px;font-size:190px;color:#e5ab33">SALT</div>
    <div class="rays"></div>
    <div id="scene3d"><div id="lat"></div></div>
    <div class="pill">SALT → SALARIUM → SALARY</div>
  </div>
</div>
<script>
const cols = {cream: ['#fffdf6','#e9e0c6','#cfc4a4'], gold: ['#f6cf72','#d79a22','#a86f12']};
const lat = document.getElementById('lat'); const S = 148;
let idx = 0;
for (let x = -1; x <= 1; x++) for (let y = -1; y <= 1; y++) for (let z = -1; z <= 1; z++) {
  const g = (x + y + z) % 3 === 0 && !(x === 0 && y === 0 && z === 0) ? 'gold' : 'cream';
  const c = document.createElement('div'); c.className = 'cu'; c.style.transform = `translate3d(${x * S}px,${y * S}px,${z * S}px)`;
  const faces = [['rotateY(0deg)', 1], ['rotateY(180deg)', 2], ['rotateY(90deg)', 2], ['rotateY(-90deg)', 1], ['rotateX(90deg)', 0], ['rotateX(-90deg)', 2]];
  faces.forEach(([r, sh]) => { const f = document.createElement('div'); f.className = 'fc'; f.style.transform = `${r} translateZ(62px)`; f.style.background = cols[g][sh]; c.appendChild(f); });
  lat.appendChild(c);
}
</script>
<script>
  window.__timelines = window.__timelines || {};
  window.__timelines['main'] = gsap.timeline({ paused: true });
</script>
</body>
</html>
