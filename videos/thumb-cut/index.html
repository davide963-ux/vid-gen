<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
@font-face { font-family: 'Space Grotesk'; font-weight: 700; src: url('assets/fonts/space-grotesk-latin-700-normal.woff2') format('woff2'); }
@font-face { font-family: 'Space Grotesk'; font-weight: 600; src: url('assets/fonts/space-grotesk-latin-600-normal.woff2') format('woff2'); }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0a0a0a; }
#root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: radial-gradient(closest-side at 50% 42%, #2b1f07, #0a0a0a 85%); font-family: 'Space Grotesk', sans-serif; color: #fffdf6; }
#stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
.t { position: absolute; left: 0; width: 1080px; text-align: center; font-weight: 700; letter-spacing: -0.035em; line-height: 1; white-space: nowrap; }
.card { position: absolute; left: 120px; top: 930px; width: 840px; height: 500px; border-radius: 50px; background: linear-gradient(135deg,#f6cf72,#d79a22 60%,#b57a12); box-shadow: 0 40px 90px rgba(0,0,0,.7), 0 0 120px rgba(229,171,51,.25), inset 0 2px 0 rgba(255,255,255,.35); transform: rotate(-6deg); }
.rays { position:absolute; left:-160px; top:640px; width:1400px; height:1400px; border-radius:50%; background: repeating-conic-gradient(from 0deg, rgba(229,171,51,.28) 0deg 9deg, rgba(229,171,51,0) 9deg 24deg); -webkit-mask-image: radial-gradient(closest-side,#000 25%,transparent 100%); }
.coinwrap { position:absolute; left:190px; top:780px; width:700px; height:700px; filter: drop-shadow(0 30px 40px rgba(0,0,0,.7)) drop-shadow(0 0 70px rgba(229,171,51,.35)); }
.sl { position:absolute; left:0; top:0; width:700px; height:700px; background: url(assets/img/coin-front.png) center/100% 100% no-repeat; }
.chipx { position: absolute; left: 64px; top: 130px; width: 120px; height: 90px; border-radius: 18px; background: linear-gradient(135deg,#fbe7a5,#c9921f); border: 2px solid rgba(0,0,0,.25); }
.num { position: absolute; left: 64px; bottom: 120px; font-weight: 700; font-size: 56px; color: #0a0a0a; letter-spacing: -.02em; }
.lab { position: absolute; left: 64px; bottom: 56px; font-weight: 600; font-size: 30px; letter-spacing: .14em; color: #3b2a05; }
.coin { position: absolute; left: 700px; top: 640px; width: 260px; height: 260px; }
.pill { position: absolute; left: 150px; top: 1560px; width: 780px; padding: 26px 0; border-radius: 100px; background: #e5ab33; color: #0a0a0a; font-weight: 700; font-size: 50px; letter-spacing: .02em; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,.5); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="1080" data-height="1920">
  <div id="stage" class="clip" data-start="0" data-duration="1" data-track-index="0">
    <div class="t" style="top:170px;font-size:106px">YOU DIDN’T KNOW</div>
    <div class="t" style="top:290px;font-size:106px">PEOPLE USED TO</div>
    <div class="t" style="top:420px;font-size:132px;color:#e5ab33">CUT COINS</div>
    <div class="t" style="top:565px;font-size:132px;color:#e5ab33">INTO PIECES</div>
    <div class="rays"></div>
    <div class="coinwrap"><div class="sl" style="clip-path:polygon(50% 50%, 50.00% -40.00%, 67.56% -38.27%, 84.44% -33.15%, 100.00% -24.83%, 113.64% -13.64%); transform: translate(calc(36.4px*0.85),calc(-87.8px*0.85)) rotate(-3deg)"></div><div class="sl" style="clip-path:polygon(50% 50%, 113.64% -13.64%, 124.83% -0.00%, 133.15% 15.56%, 138.27% 32.44%, 140.00% 50.00%); transform: translate(calc(87.8px*0.85),calc(-36.4px*0.85)) rotate(0deg)"></div><div class="sl" style="clip-path:polygon(50% 50%, 140.00% 50.00%, 138.27% 67.56%, 133.15% 84.44%, 124.83% 100.00%, 113.64% 113.64%); transform: translate(calc(87.8px*0.85),calc(36.4px*0.85)) rotate(3deg)"></div><div class="sl" style="clip-path:polygon(50% 50%, 113.64% 113.64%, 100.00% 124.83%, 84.44% 133.15%, 67.56% 138.27%, 50.00% 140.00%); transform: translate(calc(36.4px*0.85),calc(87.8px*0.85)) rotate(-3deg)"></div><div class="sl" style="clip-path:polygon(50% 50%, 50.00% 140.00%, 32.44% 138.27%, 15.56% 133.15%, -0.00% 124.83%, -13.64% 113.64%); transform: translate(calc(-36.4px*0.85),calc(87.8px*0.85)) rotate(0deg)"></div><div class="sl" style="clip-path:polygon(50% 50%, -13.64% 113.64%, -24.83% 100.00%, -33.15% 84.44%, -38.27% 67.56%, -40.00% 50.00%); transform: translate(calc(-87.8px*0.85),calc(36.4px*0.85)) rotate(3deg)"></div><div class="sl" style="clip-path:polygon(50% 50%, -40.00% 50.00%, -38.27% 32.44%, -33.15% 15.56%, -24.83% -0.00%, -13.64% -13.64%); transform: translate(calc(-87.8px*0.85),calc(-36.4px*0.85)) rotate(-3deg)"></div><div class="sl" style="clip-path:polygon(50% 50%, -13.64% -13.64%, -0.00% -24.83%, 15.56% -33.15%, 32.44% -38.27%, 50.00% -40.00%); transform: translate(calc(-36.4px*0.85),calc(-87.8px*0.85)) rotate(0deg)"></div></div>
    <div class="pill">THE “PIECE OF EIGHT”</div>
  </div>
</div>
<script>
  window.__timelines = window.__timelines || {};
  window.__timelines['main'] = gsap.timeline({ paused: true });
</script>
</body>
</html>
