<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
@font-face { font-family: 'Space Grotesk'; font-weight: 700; src: url('assets/fonts/space-grotesk-latin-700-normal.woff2') format('woff2'); }
@font-face { font-family: 'Space Grotesk'; font-weight: 600; src: url('assets/fonts/space-grotesk-latin-600-normal.woff2') format('woff2'); }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0a0a0a; }
#root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: radial-gradient(closest-side at 50% 42%, #2b1f07, #0a0a0a 85%); font-family: 'Space Grotesk', sans-serif; color: #fffdf6; }
#stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
.t { position: absolute; left: 0; width: 1080px; text-align: center; font-weight: 700; letter-spacing: -0.035em; line-height: 1; white-space: nowrap; }
.card { position: absolute; left: 120px; top: 960px; width: 840px; height: 470px; border-radius: 50px; background: linear-gradient(135deg,#f6cf72,#d79a22 60%,#b57a12); box-shadow: 0 40px 90px rgba(0,0,0,.7), 0 0 120px rgba(229,171,51,.25), inset 0 2px 0 rgba(255,255,255,.35); transform: rotate(-6deg); }
.ring { position:absolute; left:250px; top:110px; width:340px; height:340px; border-radius:50%; border:10px solid rgba(10,10,10,.55); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:92px; color:#0a0a0a; }
.dl { position:absolute; font-weight:700; font-size:80px; color:#3b2a05; }
.chipx { position: absolute; left: 64px; top: 130px; width: 120px; height: 90px; border-radius: 18px; background: linear-gradient(135deg,#fbe7a5,#c9921f); border: 2px solid rgba(0,0,0,.25); }
.num { position: absolute; left: 64px; bottom: 120px; font-weight: 700; font-size: 56px; color: #0a0a0a; letter-spacing: -.02em; }
.lab { position: absolute; left: 64px; bottom: 56px; font-weight: 600; font-size: 30px; letter-spacing: .14em; color: #3b2a05; }
.coin { position: absolute; left: 700px; top: 640px; width: 260px; height: 260px; }
.pill { position: absolute; left: 150px; top: 1510px; width: 780px; padding: 26px 0; border-radius: 100px; background: #e5ab33; color: #0a0a0a; font-weight: 700; font-size: 50px; letter-spacing: .02em; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,.5); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="1080" data-height="1920">
  <div id="stage" class="clip" data-start="0" data-duration="1" data-track-index="0">
    <div class="t" style="top:300px;font-size:146px">YOUR MONEY</div>
    <div class="t" style="top:460px;font-size:146px;color:#e5ab33">LOSES VALUE</div>
    <div class="card"><div class="ring">$1,000</div><div class="dl" style="left:60px;top:44px">$</div><div class="dl" style="right:60px;bottom:40px">$</div></div>
    <div class="pill">WHILE IT SITS STILL</div>
  </div>
</div>
<script>
  window.__timelines = window.__timelines || {};
  window.__timelines['main'] = gsap.timeline({ paused: true });
</script>
</body>
</html>
