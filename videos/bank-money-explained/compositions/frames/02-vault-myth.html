  </div>

  <script>
    const tl = gsap.timeline({ paused: true });
    const ease = 'power3.out';
    tl.fromTo('#f02-eyebrow', { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.4, ease }, 0);

    // "$1,000" counts up on the word "deposit $1,000"
    const num = document.getElementById('f02-num');
    const counter = { v: 0 };
    tl.fromTo('#f02-num', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease }, 0.1);
    tl.fromTo(counter, { v: 0 }, {
      v: 1000, duration: 1.5, ease: 'power3.out',
      onUpdate() { num.textContent = '$' + Math.round(counter.v).toLocaleString('en-US'); }
    }, 0.45);

    // second "$1,000": marker underline, vault door draws itself
    tl.fromTo('#f02-mark', { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease }, 3.7);
    tl.fromTo('#f02-door-fill', { opacity: 0 }, { opacity: 1, duration: 0.8, ease }, 3.9);
    tl.fromTo('#f02-door', { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.8, ease }, 3.46);
    tl.fromTo('#f02-inner', { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.7, ease }, 3.8);
    tl.fromTo('#f02-dial', { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.6, ease }, 4.1);
    tl.fromTo('.f02-spoke', { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.5, ease, stagger: 0.08 }, 4.45);

    // "doesn't just sit inside a vault": the dollar chip bypasses the vault
    const track = document.getElementById('f02-track');
    const total = track.getTotalLength();
    const chip = document.getElementById('f02-chip');
    const place = (p) => {
      const pt = track.getPointAtLength(total * p);
      chip.style.left = (pt.x - 36) + 'px';
      chip.style.top = (pt.y - 36) + 'px';
    };
    place(0);
    const prog = { p: 0 };
    tl.fromTo('#f02-track', { opacity: 0 }, { opacity: 0.55, duration: 0.4, ease }, 5.38);
    tl.fromTo('#f02-chip', { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease }, 5.38);
    tl.fromTo(prog, { p: 0 }, { p: 1, duration: 1.7, ease: 'power2.inOut', immediateRender: false, onUpdate() { place(prog.p); } }, 5.55);

    // "waiting for you": label, struck through
    tl.fromTo('#f02-label', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease }, 7.06);
    tl.fromTo('#f02-strike', { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease }, 7.5);
    window.__timelines['02-vault-myth'] = tl;
