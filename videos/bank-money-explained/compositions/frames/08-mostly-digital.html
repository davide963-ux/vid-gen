  <script>
    const tl = gsap.timeline({ paused: true });
    const ease = 'power3.out';
    tl.fromTo('#f08-eyebrow', { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.5, ease }, 0.1);

    // "money you see in your bank account": account card + banknote outline
    tl.fromTo('#f08-card', { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.8, ease }, 1.8);
    tl.fromTo('#f08-nb', { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.8, ease }, 2.0);
    tl.fromTo('#f08-ni', { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.7, ease }, 2.3);
    tl.fromTo('#f08-nc', { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.6, ease }, 2.6);
    tl.fromTo('#f08-ns', { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.6, ease }, 2.9);

    // "isn't physical cash at all": strike through the note, it fades back
    tl.fromTo('#f08-nx', { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.5, ease }, 3.8);
    tl.to('#f08-note', { opacity: 0.32, duration: 0.6, ease: 'none' }, 4.3);
    tl.fromTo('#f08-nlabel', { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease }, 4.5);

    // "numbers inside a financial system": the ledger digits decode into place
    const GLYPHS = '0123456789$#%&+=<>/';
    const rows = Array.from(document.querySelectorAll('.f08-rv'));
    rows.forEach((el, i) => {
      const final = el.getAttribute('data-final');
      const st = { p: 0 };
      tl.fromTo(st, { p: 0 }, {
        p: 1, duration: 1.1, ease: 'none',
        onUpdate() {
          const n = final.length;
          let out = '';
          for (let k = 0; k < n; k++) {
            const ch = final[k];
            if (ch === ' ' || ch === ',' ) { out += ch; continue; }
            if (st.p >= (k + 1) / n) out += ch;
            else out += GLYPHS[(k * 7 + i * 5 + Math.floor(st.p * 24)) % GLYPHS.length];
          }
          el.textContent = out;
        }
      }, 6.18 + i * 0.35);
      el.style.opacity = '1';
    });
    tl.fromTo('#f08-r1', { opacity: 0 }, { opacity: 1, duration: 0.3, ease }, 6.18);
    tl.fromTo('#f08-r2', { opacity: 0 }, { opacity: 1, duration: 0.3, ease }, 6.53);
