<template>
  <style>
    @font-face { font-family: 'Space Grotesk'; font-weight: 500; font-style: normal; src: url('assets/fonts/space-grotesk-latin-500-normal.woff2') format('woff2'); }
    @font-face { font-family: 'Space Grotesk'; font-weight: 600; font-style: normal; src: url('assets/fonts/space-grotesk-latin-600-normal.woff2') format('woff2'); }
    @font-face { font-family: 'Space Grotesk'; font-weight: 700; font-style: normal; src: url('assets/fonts/space-grotesk-latin-700-normal.woff2') format('woff2'); }
    #root { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; font-family: 'Space Grotesk', 'Inter', sans-serif; color: #111111; }
    .f04-bg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; background: #fdfae7; }
    .f04-layer { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    .f04-tag { position: absolute; left: 0; top: 210px; width: 1080px; text-align: center; font-size: 40px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #1e2bfa; }
    .f04-dot { position: absolute; width: 64px; height: 64px; border-radius: 50%; background: #1e2bfa; opacity: 0.88; }
    #f04-bank { position: absolute; left: 160px; top: 1190px; width: 760px; height: 300px; border-radius: 14px; background: rgba(30, 43, 250, 0.04); border: 1.5px solid rgba(30, 43, 250, 0.2); }
    #f04-bank svg { position: absolute; left: 40px; top: 44px; width: 96px; height: 96px; }
    #f04-bank .f04-h { position: absolute; left: 164px; top: 56px; font-size: 38px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #1e2bfa; }
    #f04-bank .f04-s { position: absolute; left: 164px; top: 106px; font-family: 'Inter', sans-serif; font-size: 34px; color: #6b6b6b; }
    #f04-track { position: absolute; left: 60px; top: 190px; width: 640px; height: 40px; border-radius: 6px; background: rgba(30, 43, 250, 0.08); }
    #f04-fill { display: block; width: 100%; height: 100%; border-radius: 6px; background: #1e2bfa; transform-origin: left center; }
    #f04-note { position: absolute; left: 0; top: 1530px; width: 1080px; text-align: center; }
    #f04-note span { display: inline-block; padding: 14px 34px; border-radius: 100px; background: rgba(30, 43, 250, 0.08); color: #1e2bfa; font-size: 34px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
    .f04-s2 { fill: none; stroke: #1e2bfa; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <div data-hf-id="hf-spma" id="root" data-composition-id="04-everyone-at-once" data-start="0" data-duration="11.861" data-width="1080" data-height="1920">
    <div data-hf-id="hf-ggjb" id="f04-bg" class="clip f04-bg" data-start="0" data-duration="11.861" data-track-index="0"></div>
    <div data-hf-id="hf-k65u" id="f04-layer" class="clip f04-layer" data-start="0" data-duration="11.861" data-track-index="1">
      <div data-hf-id="hf-dm2n" id="f04-t1" class="f04-tag">Imagine</div>
      <div data-hf-id="hf-241h" id="f04-t2" class="f04-tag">Tomorrow</div>
      <div data-hf-id="hf-2a2w" id="f04-t3" class="f04-tag">All at once</div>
      <div data-hf-id="hf-4k5i" id="f04-dots"></div>
      <div data-hf-id="hf-y7w8" id="f04-bank">
        <svg data-hf-id="hf-y7z7" viewBox="0 0 96 96"><path data-hf-id="hf-57st" class="f04-s2" d="M8 38 L48 14 L88 38 Z M16 82 H80 M20 44 V74 M40 44 V74 M56 44 V74 M76 44 V74" /></svg>
        <div data-hf-id="hf-34x0" class="f04-h">Cash on hand</div><div data-hf-id="hf-hk75" class="f04-s">the bank</div>
        <div data-hf-id="hf-xtd3" id="f04-track"><span data-hf-id="hf-ha8i" id="f04-fill"></span></div>
      </div>
      <div data-hf-id="hf-g9d2" id="f04-note"><span data-hf-id="hf-9s0p">Not enough cash</span></div>
    </div>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });
    const ease = 'power3.out';
    const COLS = 6, ROWS = 6;

    // build the customer grid deterministically (index-derived positions only)
    const host = document.getElementById('f04-dots');
    const dots = [];
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const d = document.createElement('div');
        d.className = 'f04-dot';
        const sx = 540 + (c - (COLS - 1) / 2) * 128 - 32;
        const sy = 300 + r * 106;
        // pile target: tighter and overlapping, just above the bank card
        const tx = 540 + (c - (COLS - 1) / 2) * 104 - 32;
        const ty = 1120 - (ROWS - 1 - r) * 78 - 32;
        d.style.left = sx + 'px';
        d.style.top = sy + 'px';
        host.appendChild(d);
        dots.push({ el: d, dx: tx - sx, dy: ty - sy, r, c });
      }
    }

    tl.fromTo('#f04-t1', { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.4, ease }, 0);
    tl.fromTo('#f04-bank', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease }, 0.5);

    // "every customer walked into the bank": the crowd arrives row by row
    for (let r = 0; r < ROWS; r++) {
      const rowEls = dots.filter(d => d.r === r).map(d => d.el);
      tl.fromTo(rowEls, { opacity: 0, scale: 0.4 }, { opacity: 0.88, scale: 1, duration: 0.45, ease, stagger: 0.04 }, 1.58 + r * 0.18);
    }

    // "tomorrow"
    tl.fromTo('#f04-t2', { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.4, ease }, 3.04);
    tl.to('#f04-t1', { opacity: 0, duration: 0.3, ease: 'none' }, 3.04);

    // "asked for all their money" : everyone moves toward the bank in lockstep
    dots.forEach((d) => {
      tl.fromTo(d.el, { x: 0, y: 0, scale: 1 }, { x: d.dx, y: d.dy, scale: 0.92, duration: 1.7, ease: 'power3.inOut' }, 4.3 + d.r * 0.03);
    });

    // "same time"
    tl.fromTo('#f04-t3', { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.4, ease }, 5.9);
    tl.to('#f04-t2', { opacity: 0, duration: 0.3, ease: 'none' }, 5.9);

    // the cash meter drains as they all arrive
    tl.fromTo('#f04-fill', { scaleX: 1 }, { scaleX: 0.06, duration: 2.3, ease: 'power2.in' }, 6.3);

    // "couldn't hand everyone physical cash"
    tl.fromTo('#f04-note', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease }, 8.7);
    window.__timelines['04-everyone-at-once'] = tl;
  </script>
</template>
