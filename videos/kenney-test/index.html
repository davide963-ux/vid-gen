<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script type="importmap">
      { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.181.2/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.2/examples/jsm/"
      } }
    </script>
    <style>
      * { margin: 0; padding: 0; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #fdfae7; }
      #root { position: relative; width: 1080px; height: 1920px; }
      #gl { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; display: block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1080" data-height="1920">
      <canvas id="gl" width="1080" height="1920"></canvas>
    </div>
    <script type="module">
      import * as THREE from 'three';
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
      const W = 1080, H = 1920;
      async function build() {
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: true });
        renderer.setPixelRatio(1); renderer.setSize(W, H, false);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xfdfae7); scene.fog = new THREE.Fog(0xfdfae7, 8, 22);
        const camera = new THREE.PerspectiveCamera(46, W / H, 0.1, 100);
        scene.add(new THREE.HemisphereLight(0xffffff, 0xd9d2b8, 1.6));
        const sun = new THREE.DirectionalLight(0xffffff, 1.7); sun.position.set(4, 8, 5); scene.add(sun);
        const road = new THREE.Mesh(new THREE.PlaneGeometry(40, 60), new THREE.MeshLambertMaterial({ color: 0xc9c4ac })); road.rotation.x = -Math.PI / 2; scene.add(road);
        const loader = new GLTFLoader();
        const load = (u) => new Promise((res, rej) => loader.load(u, res, undefined, rej));
        // load a model, then scale it so its own measured size matches a target (so the file's unit system doesn't matter)
        const place = async (url, x, z, ry = 0, target = 1, mode = 'width') => {
          const g = await load(url); const o = g.scene; scene.add(o); o.updateMatrixWorld(true);
          let box = new THREE.Box3().setFromObject(o), size = box.getSize(new THREE.Vector3());
          const ref = mode === 'height' ? size.y : Math.max(size.x, size.z); const k = target / ref;
          o.scale.multiplyScalar(k); o.updateMatrixWorld(true); box = new THREE.Box3().setFromObject(o);
          o.position.set(x, -box.min.y, z); o.rotation.y = ry; return { o, anims: g.animations };
        };
        const C = 'assets/models/commercial/', S = 'assets/models/suburban/', P = 'assets/models/chars/';
        const left = ['building-a', 'building-skyscraper-b', 'building-c', 'building-f', 'building-skyscraper-a', 'building-h'];
        const right = ['building-d', 'building-skyscraper-c', 'building-g', 'building-j', 'building-skyscraper-d', 'building-m'];
        for (let i = 0; i < left.length; i++) { await place(C + left[i] + '.glb', -1.7, -i * 1.3 + 0.5, Math.PI / 2, 1.2); await place(C + right[i] + '.glb', 1.7, -i * 1.3 + 0.5, -Math.PI / 2, 1.2); }
        await place(S + 'building-type-a.glb', -3.3, -2, Math.PI / 2, 1.4); await place(S + 'building-type-d.glb', 3.3, -3, -Math.PI / 2, 1.4);
        const cast = [['character-a', -0.5, 2.2, 'walk', 0.12], ['character-d', 0.5, 1.4, 'idle', 0], ['character-h', -0.15, 0.3, 'emote-yes', 0], ['character-m', 0.5, -0.9, 'sprint', 0.25], ['character-r', -0.5, -2.0, 'walk', 0.1]];
        const actors = [];
        for (const [name, x, z, clip, speed] of cast) { const a = await place(P + name + '.glb', x, z, Math.PI, 0.95, 'height'); const mixer = new THREE.AnimationMixer(a.o); const c = THREE.AnimationClip.findByName(a.anims, clip); mixer.clipAction(c).play(); actors.push({ a, mixer, x, z, speed }); }
        function renderAt(t) {
          camera.position.set(0.1 + Math.sin(t * 0.5) * 0.15, 1.5, 5.0 - t * 0.08); camera.lookAt(0, 0.6, -2.0);
          actors.forEach((k) => { k.mixer.setTime(t); k.a.o.position.z = k.z - k.speed * t; });
          renderer.render(scene, camera);
        }
        window.addEventListener('hf-seek', (e) => renderAt(e.detail.time));
        renderAt(window.__hfThreeTime || 0);
      }
      window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {}; window.__hf.buildReady.kenney = build();
    </script>
  </body>
</html>
