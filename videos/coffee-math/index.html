        const dk = (await load('assets/models/furniture/desk.glb')).scene; desk.add(dk); const dbox = fit(dk, 4.2, 'width'); const TOP = dbox.max.y;

        const chair = (await load('assets/models/furniture/chairDesk.glb')).scene; desk.add(chair); fit(chair, 1.9, 'height'); chair.position.set(-0.9, 0, 1.7); chair.rotation.y = Math.PI + 0.3;

        const heroG = new THREE.Group(); scene.add(heroG); const heroCup = cupG.scene.clone(true); heroG.add(heroCup); fit(heroCup, 0.74, 'width');

          heroG.position.set(lerp(0.55, cell0.x, drop), lerp(TOP, 0, drop) + Math.sin(Math.PI * drop) * 1.6, lerp(16.9, cell0.z, drop));
          heroG.rotation.y = t * 0.6 * (1 - drop);

          // the field
          for (let i = 1; i < N; i++) {
            const a = win(t, appear[i] - 0.1, appear[i] + 0.35), p = cellPos(i);
            D.position.copy(p); D.position.y = (1 - a) * 2.2; D.rotation.set(0, (i * 0.37) % 6.28, 0); D.scale.setScalar(Math.max(0.0001, a)); D.updateMatrix();
            for (let k = 0; k < inst.length; k++) { M.multiplyMatrices(D.matrix, parts[k].m); inst[k].setMatrixAt(i, M); }
            D.position.y = 0.012; D.rotation.set(-Math.PI / 2, 0, 0); D.scale.setScalar(Math.max(0.0001, a * 1.15)); D.updateMatrix(); shadow.setMatrixAt(i, D.matrix);
          }
          // instance 0 is hidden (the hero cup is the first coffee)
          D.position.set(0, -50, 0); D.scale.setScalar(0.0001); D.updateMatrix(); for (let k = 0; k < inst.length; k++) inst[k].setMatrixAt(0, D.matrix); shadow.setMatrixAt(0, D.matrix);
          inst.forEach((im) => { im.instanceMatrix.needsUpdate = true; }); shadow.instanceMatrix.needsUpdate = true;
          renderer.render(scene, camera);
        }
        window.addEventListener('hf-seek', (e) => renderAt(e.detail.time));
        renderAt(window.__hfThreeTime || 0);
      }
      window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {}; window.__hf.buildReady['coffee-3d'] = build();
    </script>
